<!doctype html><html lang="en"><head><meta charset="utf-8"><style>

*{box-sizing:border-box}html,body{margin:0;padding:0}#panel-content{display:flow-root;width:100%;padding:22px}button,input,textarea{font:inherit;color:inherit}button,summary,input{outline-offset:4px}button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:1px solid var(--cyan)}button{cursor:pointer}button:disabled{cursor:default}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font:19px/1.25 'Departure Mono',monospace;font-weight:400;letter-spacing:-.6px;margin:0}.state{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}.led{width:5px;height:5px;border-radius:50%;background:#686e77}.state[data-live=true] .led{background:var(--green);box-shadow:0 0 8px #91c49a35}.state[data-live=true]{color:var(--green)}

</style></head><body><main id="panel-content">

</div>
<div class="padding-row"><label for="padding">padding</label><div id="padding-box" class="value-box" title="drag to adjust padding; shift for fine control" data-scrubbing="false"><span id="padding-scrub" class="scrub" role="slider" tabindex="0" aria-label="padding" aria-valuemin="0" aria-valuemax="200" aria-valuenow="12"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width=".8" aria-hidden="true"><path d="M1.5 2v8m9-8v8M3 6h6M4.5 4.5 3 6l1.5 1.5m3-3L9 6 7.5 7.5"/></svg></span><input id="padding" aria-label="padding in pixels" type="number" min="0" max="200" step="1" value="12"><span class="unit">px</span></div></div>
<button id="toggle" class="primary" data-live="false" disabled>start reflow</button>

</details>
</main>
