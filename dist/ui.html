    resize = { id: event.pointerId, x: event.clientX, y: event.clientY, width: window.innerWidth, height: window.innerHeight };
  };
  grip.onpointermove = (event) => {
    if (!resize || resize.id !== event.pointerId) return;
    if (event.buttons === 0) {
      endResize(event);
      return;
    }
    const width = resize.width + event.clientX - resize.x, height = resize.height + event.clientY - resize.y;
    grip.title = `resize window \xB7 ${Math.round(width)} \xD7 ${Math.round(height)}`;
    send({ type: "resize", width, height });
  };
  function endResize(event) {
    if (resize?.id !== event.pointerId) return;
    resize = null;
    grip.title = "drag to resize window";
    if (grip.hasPointerCapture(event.pointerId)) grip.releasePointerCapture(event.pointerId);
  }
  grip.onpointerup = endResize;
  grip.onpointercancel = endResize;
  grip.onlostpointercapture = endResize;
  window.onpointerup = (event) => {
    endScrub(event);
    endResize(event);
  };
  grip.onkeydown = (event) => {
    if (!["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].includes(event.key)) return;
    event.preventDefault();
    const step = event.shiftKey ? 50 : 10;
    send({ type: "resize", width: window.innerWidth + (event.key === "ArrowRight" ? step : event.key === "ArrowLeft" ? -step : 0), height: window.innerHeight + (event.key === "ArrowDown" ? step : event.key === "ArrowUp" ? -step : 0) });
  };
  el("more").ontoggle = fitHeight;
  el("diagnostics").ontoggle = () => {
    if (el("more").open) fitHeight();
  };
  new ResizeObserver(() => {
    if (!resize) fitHeight();
  }).observe(content);
  send({ type: "ui-ready" });
})();
